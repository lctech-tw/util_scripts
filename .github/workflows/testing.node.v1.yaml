name: testing.node.v1
on:
  workflow_call:
    inputs:
      NODE_VERSION:
        description: "Node.js version (if not using .nvmrc)"
        required: false
        type: string
        default: ""
      TEST_SCRIPT:
        description: "NPM script to run tests"
        required: false
        type: string
        default: "test"
      LINT_SCRIPT:
        description: "NPM script to run linting"
        required: false
        type: string
        default: "lint"
      COVERAGE_THRESHOLD:
        description: "Minimum test coverage percentage"
        required: false
        type: number
        default: 80
      USE_PNPM:
        description: "Use pnpm instead of npm"
        required: false
        type: boolean
        default: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔐 Obtain GitHub App Installation Access Token
        id: githubAppAuth
        run: |
          TOKEN=$(npx obtain-github-app-installation-access-token ci ${{secrets.GH_APP_CREDENTIALS_TOKEN}})
          echo "::add-mask::$TOKEN" && echo "::set-output name=token::$TOKEN"

      - name: 🔧 Configure GitHub authentication
        run: |
          git config --global url."https://oauth2:$GITHUB_TOKEN@github.com/lctech-tw".insteadOf "https://github.com/lctech-tw"
          rm -rf .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
          echo "@lctech-tw:registry=https://npm.pkg.github.com/" >> .npmrc
        env:
          GITHUB_TOKEN: ${{steps.githubAppAuth.outputs.token}}

      - name: ⚙️ Set up Pnpm
        if: inputs.USE_PNPM
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.NODE_VERSION != '' && inputs.NODE_VERSION || null }}
          node-version-file: ${{ inputs.NODE_VERSION == '' && '.nvmrc' || null }}
          cache: ${{ inputs.USE_PNPM && 'pnpm' || 'npm' }}

      - name: 📦 Install dependencies
        run: |
          if [ "${{inputs.USE_PNPM}}" == "true" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: 🔍 Run linting
        run: |
          if [ "${{inputs.USE_PNPM}}" == "true" ]; then
            pnpm run ${{inputs.LINT_SCRIPT}}
          else
            npm run ${{inputs.LINT_SCRIPT}}
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔐 Obtain GitHub App Installation Access Token
        id: githubAppAuth
        run: |
          TOKEN=$(npx obtain-github-app-installation-access-token ci ${{secrets.GH_APP_CREDENTIALS_TOKEN}})
          echo "::add-mask::$TOKEN" && echo "::set-output name=token::$TOKEN"

      - name: 🔧 Configure GitHub authentication
        run: |
          git config --global url."https://oauth2:$GITHUB_TOKEN@github.com/lctech-tw".insteadOf "https://github.com/lctech-tw"
          rm -rf .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
          echo "@lctech-tw:registry=https://npm.pkg.github.com/" >> .npmrc
        env:
          GITHUB_TOKEN: ${{steps.githubAppAuth.outputs.token}}

      - name: ⚙️ Set up Pnpm
        if: inputs.USE_PNPM
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.NODE_VERSION != '' && inputs.NODE_VERSION || null }}
          node-version-file: ${{ inputs.NODE_VERSION == '' && '.nvmrc' || null }}
          cache: ${{ inputs.USE_PNPM && 'pnpm' || 'npm' }}

      - name: 📦 Install dependencies
        run: |
          if [ "${{inputs.USE_PNPM}}" == "true" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: 🧪 Run tests with coverage
        run: |
          if [ "${{inputs.USE_PNPM}}" == "true" ]; then
            pnpm run ${{inputs.TEST_SCRIPT}} -- --coverage
          else
            npm run ${{inputs.TEST_SCRIPT}} -- --coverage
          fi

      - name: 📊 Check coverage threshold
        run: |
          echo "檢查測試覆蓋率是否達到門檻..."
          echo "門檻值: ${{inputs.COVERAGE_THRESHOLD}}%"
          # Parse coverage from coverage report (assuming Jest or similar)
          if [ -f "coverage/coverage-summary.json" ]; then
            TOTAL_COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
            echo "目前測試覆蓋率: ${TOTAL_COVERAGE}%"
            if (( $(echo "$TOTAL_COVERAGE >= ${{inputs.COVERAGE_THRESHOLD}}" | bc -l) )); then
              echo "✅ 通過覆蓋率門檻"
            else
              echo "❌ 未達到覆蓋率門檻"
              exit 1
            fi
          else
            echo "⚠️ 找不到覆蓋率報告，跳過檢查"
          fi

      - name: 📤 Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
